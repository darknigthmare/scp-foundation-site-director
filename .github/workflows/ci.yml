name: SCP Builder checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Upload compiled game
        uses: actions/upload-artifact@v4
        with:
          name: scp-build
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Browser smoke and persistent save round-trip
        run: python tests/smoke.py
      - name: Generate cumulative playable package
        run: python scripts/package_release.py
      - name: Upload source, playable build and SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: scp-operations-package
          path: test-results/package/
          if-no-files-found: error
          retention-days: 14
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scp-browser-smoke
          path: test-results/smoke/
          if-no-files-found: warn
          retention-days: 14

